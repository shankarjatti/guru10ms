id: hop_band_select
label: Hop Band Select
category: '[DOA]'

parameters:
- id: num_channels
  label: Num Channels
  dtype: int
  default: '4'
- id: band_freq
  label: Band (Hz)
  dtype: real
  default: '2.4e9'
- id: frame_tag
  label: Window-start tag key ('' = none)
  dtype: string
  default: ''
- id: frame_offset
  label: Tag this many samples into each window
  dtype: int
  default: '100'

inputs:
- domain: stream
  dtype: complex
  multiplicity: ${num_channels}

outputs:
- domain: stream
  dtype: complex
  multiplicity: ${num_channels}

templates:
  imports: import doa
  make: doa.hop_band_select(${num_channels}, ${band_freq}, ${frame_tag}, ${frame_offset})
  callbacks:
  - set_band_freq(${band_freq})

documentation: |-
  Passes only the dwell samples of one band, as marked by the hopping
  source's hop_on / hop_off tags on input 0. Switching samples and every other
  band are dropped, so the output is shorter than the input.

file_format: 1
